name: nombre del pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  echo-job:
    name: Run Echo Commands
    runs-on: self-hosted

    steps:
      - name: Step 1 - Descargar repositorio
        uses: actions/checkout@v4

      - name: Step 2 - Comprobar archivos
        run: ls -la

      - name: Step 3 - Construir imagen Docker
        run: docker build -t image-ipod2 .

      - name: Step 4 - Mostrar fecha
        run: echo "The current date and time is: $(date)"
